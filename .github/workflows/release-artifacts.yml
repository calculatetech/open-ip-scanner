name: Release artifacts

"on":
  workflow_dispatch:
  push:
    tags:
      - v1.0.0

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  release-artifacts:
    name: verified 1.0 release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Refuse non-1.0 or dirty source
        run: |
          test -z "$(git status --porcelain)"
          grep -Fqx 'project(OpenIpScanner VERSION 1.0.0 LANGUAGES CXX)' CMakeLists.txt
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream binutils desktop-file-utils devscripts file gzip lintian libxml2-utils \
            ninja-build python3 python3-yaml \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins
      - name: Run full release gate
        env:
          ASAN_OPTIONS: detect_leaks=0
          OIS_SKIP_HARDWARE_TIMING_ASSERTIONS: "1"
          OIS_TSAN_EXCLUDE: scan_cancellation_deadlines|linux_neighbor_probe_contract|linux_ping_probe_contract|^startup_accessibility_scale_[12]$
          QT_QPA_PLATFORM: offscreen
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./scripts/quality-gate.sh release
      - name: Attest package and source provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            build/release-artifacts/*.deb
            build/release-artifacts/*.tar.gz
            build/release-artifacts/*.spdx.json
            build/release-artifacts/SHA256SUMS
      - name: Attest package SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          subject-path: build/release-artifacts/*.deb
          sbom-path: build/release-artifacts/*.spdx.json
      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-ip-scanner-1.0.0
          path: build/release-artifacts/*
          if-no-files-found: error
