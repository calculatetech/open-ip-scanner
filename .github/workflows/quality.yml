name: Quality

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils libxml2-utils ninja-build python3 python3-yaml \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins
      - name: Run full quality gate
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          OIS_SKIP_HARDWARE_TIMING_ASSERTIONS: "1"
          OIS_TSAN_EXCLUDE: scan_cancellation_deadlines|linux_neighbor_probe_contract|linux_ping_probe_contract|^startup_accessibility_scale_[12]$
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./scripts/quality-gate.sh full

  quality-newest:
    name: quality-newest
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 30
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - name: Check out source
        uses: actions/checkout@v5
      - name: Trust checked-out source
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream build-essential clang-tidy cmake desktop-file-utils \
            libxml2-utils ninja-build python3 python3-yaml \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins
      - name: Run full quality gate
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          OIS_SKIP_HARDWARE_TIMING_ASSERTIONS: "1"
          OIS_TSAN_EXCLUDE: scan_cancellation_deadlines|linux_neighbor_probe_contract|linux_ping_probe_contract
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./scripts/quality-gate.sh full

  release-artifact:
    name: tested release artifact
    needs: [quality, quality-newest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream binutils desktop-file-utils devscripts file gzip lintian libxml2-utils \
            ninja-build python3 python3-yaml \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins
      - name: Build and test release artifact
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build-release-artifact.sh
      - name: Upload tested release artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-ip-scanner-${{ github.sha }}
          path: release/*.deb
          if-no-files-found: error
          retention-days: 14
